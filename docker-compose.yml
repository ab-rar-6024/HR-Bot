# Fully offline: no outbound calls except webhooks you explicitly allow-list.
services:
  verifyops:
    build: .
    ports: ["8000:8000"]
    environment:
      VERIFYOPS_API_KEYS: ${VERIFYOPS_API_KEYS:?set a strong key in .env}
      VERIFYOPS_WEBHOOK_HOSTS: ${VERIFYOPS_WEBHOOK_HOSTS:-}
      VERIFYOPS_PUBLIC_URL: ${VERIFYOPS_PUBLIC_URL:-http://localhost:8000}
      VERIFYOPS_ICE: ${VERIFYOPS_ICE:-stun:stun.l.google.com:19302}
    volumes:
      - ./data:/srv/data        # DB, heatmaps, certificates, signing key (back this up)
      - ./models:/srv/models:ro # drop face/scene/document .onnx here
    restart: unless-stopped
